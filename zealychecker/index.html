<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/zealychecker/">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="author" content="Decentral" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#00ff95" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://useedecentral.com/zealychecker" />
  <meta property="og:title" content="Decentral Zealy Reward Checker" />
  <meta property="og:description" content="Check your $DCT rewards earned on Zealy and add tokens to your MetaMask wallet instantly." />

  <meta property="og:site_name" content="Decentral" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="https://x.com/usedecentral" />
  <meta name="twitter:title" content="Decentral | Zealy Checker" />
  <meta name="twitter:description" content="Check your $DCT rewards earned on Zealy and add tokens to your MetaMask wallet instantly." />
  <meta name="twitter:image" content="https://i.ibb.co/JF7RpGC1/Decentral.jpg" />

  <!-- Favicon & App Icons -->
  <link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

  <!-- External CSS -->
  <link rel="stylesheet" href="/zealychecker/assets/css/index.css" />
</head>
<body>
  <!-- HEADER -->
  <header>
    <img src="/assets/img/logo.png" alt="Decentral" class="logo" />
    <a href="https://app.usedecentral.com" class="launch">
      Launch App
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <div class="card" id="card">
      <h1>Check your reward</h1>
      <p>Enter your Zealy username to see how much $DCT you earned.</p>
      <input id="username" type="text" placeholder="Enter your Zealy username" />
      <button id="checkBtn" type="button">Check</button>
      <div id="error" class="error-message" aria-live="assertive"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="copyright">Copyright
      &copy; 2025 <a href="https://wearedux.com">DUX</a> - All rights reserved
    </div>
    <div class="socials">
      <a href="https://x.com/usedecentral" title="Twitter">
        <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/svgs/brands/twitter.svg" alt="Twitter"/>
      </a>
      <a href="https://bit.ly/dctdiscord" title="Discord">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/discord.svg" alt="Discord"/>
      </a>
      <a href="https://t.me/usedecentral" title="Telegram">
        <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/svgs/brands/telegram.svg" alt="Telegram"/>

  <script src="/zealychecker/assets/js/index.js"></script>
